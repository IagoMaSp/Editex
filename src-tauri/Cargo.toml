[package]
name = "editex"
version = "0.1.0"
description = "Editor LaTeX de escritorio"
edition = "2021"

[lib]
name = "editex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2.191"
notify-debouncer-mini = "0.7.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
spellbook = "0.4.2"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1.54.1", features = ["process", "io-util", "sync", "rt", "macros", "time"] }
trash = "5.2.9"
walkdir = "2.5.0"
zip = "9.1.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
