# Compila los instaladores para Linux, Windows y macOS.
#
# - Al subir una etiqueta vX.Y.Z crea un *borrador* de release con los instaladores
#   adjuntos; se revisa y se publica a mano desde GitHub.
# - En pull requests que tocan el empaquetado solo compila y guarda los archivos
#   como artefactos del workflow (sin crear release).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            args: ""
          - platform: windows-latest
            name: windows
            args: ""
          - platform: macos-latest
            name: macos-arm64
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macos-x64
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias del sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.name, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Solo con etiqueta: crea (o completa) el borrador de release de esa versión.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Editex ${{ github.ref_name }}
          releaseBody: |
            Instrucciones de instalación para cada sistema en el [README](https://github.com/${{ github.repository }}#instalación).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Guardar instaladores como artefacto
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: editex-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
          if-no-files-found: error
