# Compila Editex para Linux, macOS (Apple Silicon e Intel) y Windows.
# - En cada push a una rama feat/* o a main, y a mano (Actions → Run workflow):
#   deja los instaladores como artefactos descargables del run.
# - Al subir un tag v* (p. ej. v0.2.0): crea un release en borrador con los instaladores.
name: Build

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: macos-arm
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # La versión de pnpm sale de "packageManager" en package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Instalar dependencias JS
        run: pnpm install --frozen-lockfile

      - name: Comprobaciones
        if: matrix.name == 'linux'
        run: |
          pnpm check
          cd src-tauri && cargo test --target ${{ matrix.target }}

      - name: Descargar texlab (incluido en la app de Windows/macOS)
        if: matrix.name != 'linux'
        run: scripts/fetch-texlab.sh ${{ matrix.target }}

      - name: Compilar (artefactos)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        with:
          args: --target ${{ matrix.target }}

      - name: Compilar y publicar release (borrador)
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Editex ${{ github.ref_name }}
          releaseBody: |
            Instaladores de Editex. Necesitas una distribución LaTeX instalada:
            - Windows: MiKTeX (https://miktex.org) o TeX Live.
            - macOS: MacTeX (https://tug.org/mactex).
            - Linux: TeX Live de tu distribución.
            Las apps no están firmadas: ver el README para abrirlas la primera vez.
          releaseDraft: true

      - name: Subir instaladores
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: editex-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
          if-no-files-found: error
